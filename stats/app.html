<!DOCTYPE html>
<!-- 
This file is the HTML viewer for json data analysed from Gmail Takeout mbox files. It is generated by the script generate.py.

1. Run the script to generate the JSON data:   python generate.py <mbox|maildir>...
2. Serve the files with a local HTTP server:   python start-web.py
3. Open the HTML viewer in a browser:         http://localhost:9000/

-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail Explorer</title>

<!-- Tabulator 6.5.0 -->
<link href="https://unpkg.com/tabulator-tables@6.5.0/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@6.5.0/dist/js/tabulator.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  padding: 0;
  background: #f5f6f8;
  color: #1f2328;
}

#controls {
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e1e4e8;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#controls-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

#jsonSelector {
  max-width: 220px;
}

#searchWrap {
  position: relative;
  display: inline-block;
}
#searchFilter {

}

select {

  background: #fff;

<body>

<div id="controls">
  <div id="controls-top">
    <select id="jsonSelector" style="display:none;">
      <option value="">Select JSON file…</option>
    </select>

    <span id="searchWrap">
      <input type="text" id="searchFilter" placeholder="Filter…">
      <button id="searchClear" title="Clear filter" type="button">×</button>
    </span>

    <ul id="groupList"></ul>

    <select id="groupAdd" title="Add grouping criterion">
      <option value="">+ Add…</option>
      <option value="year">Year</option>
      <option value="year_date">Year (date)</option>
      <option value="month">Month</option>
      <option value="gmail_labels">Gmail labels (flat)</option>
      <option value="gmail_labels_tree">Gmail labels (tree)</option>
      <option value="from">From</option>
      <option value="to">To</option>
      <option value="source_file">Source file</option>
      <option value="source_file_tree">Source file (tree)</option>
      <option value="diff_status">Diff status</option>
      <option value="mid_dup">Duplicate Message-ID</option>
      <option value="dup_status">Duplicate (yes/no)</option>
      <option value="mid_invalid">Invalid Message-ID</option>
    </select>

    <label class="chk" id="depthWrap" title="Max decomposition level for tree groupings" style="display:none">
      Depth
      <select id="maxTreeDepth">
        <option value="">Sans limite</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
    </label>

    <button id="applyGrouping" class="icon-btn" title="Refresh">⟳</button>

    <label class="chk" title="Include Gmail system labels in grouping">
      <input type="checkbox" id="filterGmailSystemLabels">
      GMail Labels
    </label>

    <button id="resetConfig" class="icon-btn" title="Reset configuration (clears saved preferences)">🧹</button>
  </div>
</div>

<div id="treegrid"></div>

<div id="spinner">Computing…</div>

<script>

const PATH_MAILS_JSON = "data/mails.json";

let RAW_DATA = [];

/* ------------------------------
   Labels Gmail automatiques
--------------------------------*/
const GMAIL_SYSTEM_LABELS = new Set([
  "IMPORTANT", "Important",
  "Ouvert",
  "Messages archivés",
  "INBOX", "Boîte de réception",
  "STARRED", "Favoris",
  // "SENT", "Messages envoyés",
  "DRAFT", "Brouillons",
  "SPAM",
  "TRASH",
  "UNREAD", "Non lus",
  "CATEGORY_PERSONAL", "Catégorie : E-mails personnels",
  "CATEGORY_SOCIAL", "Catégorie : Réseaux sociaux",
  "CATEGORY_UPDATES", "Catégorie : Mises à jour",
  "CATEGORY_PROMOTIONS", "Catégorie : Promotions",
  "CATEGORY_FORUMS", "Catégorie : Forums",
  "IMAP_NonJunk",
  "IMAP_Junk",
  "Forward to 0660314776@imode.fr",
  "Forward to remi.peyronnet@free.fr",
  "Ignoré",
  "Messagerie instantanée",
  "En attente"
]);

/* ------------------------------
   Filtrage des labels Gmail
--------------------------------*/
function filterLabels(mail) {
  const showSystem = document.getElementById("filterGmailSystemLabels").checked;

  let labels = Array.isArray(mail.gmail_labels) ? mail.gmail_labels.slice() : [];

  if (!showSystem) {
    labels = labels.filter(lbl => !GMAIL_SYSTEM_LABELS.has(lbl));
  }

  if (labels.length === 0) {
    labels = ["(no label)"];
  }

  return labels;
}

/* ------------------------------
   Chargement du JSON
--------------------------------*/
let currentJsonPath = PATH_MAILS_JSON;

async function detectServer() {
  try {
    const resp = await fetch('/api/list-json');
    if (resp.ok) {
      const files = await resp.json();
      const selector = document.getElementById('jsonSelector');
      selector.style.display = 'inline-block';

      files.forEach(file => {
        const opt = document.createElement('option');
        opt.value = `data/${file}`;
        opt.textContent = file;
        if (opt.value === PATH_MAILS_JSON) opt.selected = true;
        selector.appendChild(opt);
      });

      selector.addEventListener('change', e => {
        if (e.target.value) {
          currentJsonPath = e.target.value;
          loadData();
        }
      });

      return true;
    }
  } catch (e) {
    // Not on server, use default
  }
  return false;
}

async function loadData() {
  try {
    const resp = await fetch(currentJsonPath);
    const data = await resp.json();
    // month / year_date computed client-side (month: real_date preferred, fallback date)
    data.forEach(m => {
      m.month = "";
      m.year_date = "";
      const raw = m.real_date || m.date;
      if (raw) {
        const d = new Date(raw);
        if (!isNaN(d)) {
          m.month = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        }
      }
      if (m.date) {
        const d2 = new Date(m.date);
        if (!isNaN(d2)) m.year_date = String(d2.getFullYear());
      }
    });
    RAW_DATA = data;
    fieldsEnriched = false;

    // Reset grouping on first load
    const groupList = document.getElementById('groupList');
    if (groupList.children.length === 0) {
      addGroupingItem("year");
      addGroupingItem("gmail_labels_tree");
    }

    applyGrouping();
  } catch (e) {
    console.error('Failed to load JSON:', e);
  }
}

/* ------------------------------
   Configuration persistée (localStorage)
--------------------------------*/
const CONFIG_KEY = "mail-explorer-config";

function saveConfig() {
  const cfg = {
    jsonPath: currentJsonPath,
    filter: document.getElementById("searchFilter").value,
    groups: getGroupingFields(),
    gmailSystem: document.getElementById("filterGmailSystemLabels").checked,
    maxDepth: document.getElementById("maxTreeDepth").value,
  };
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }
}

function loadConfig() {
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY)); } catch (e) { return null; }
}

function applyConfig(cfg) {
  if (!cfg || typeof cfg !== "object") return;
  if (cfg.jsonPath) {
    const sel = document.getElementById("jsonSelector");
    if ([...sel.options].some(o => o.value === cfg.jsonPath)) {
      currentJsonPath = cfg.jsonPath;
      sel.value = cfg.jsonPath;
    }
  }
  if (Array.isArray(cfg.groups)) {
    const ul = document.getElementById("groupList");
    ul.innerHTML = "";
    cfg.groups.forEach(g => addGroupingItem(g));
  }
  if (typeof cfg.filter === "string") {
    document.getElementById("searchFilter").value = cfg.filter;
    updateSearchClear();
  }
  if (typeof cfg.gmailSystem === "boolean") {
    document.getElementById("filterGmailSystemLabels").checked = cfg.gmailSystem;
  }
  if (typeof cfg.maxDepth === "string" || typeof cfg.maxDepth === "number") {
    document.getElementById("maxTreeDepth").value = cfg.maxDepth;
  }
}

function updateSearchClear() {
  const v = document.getElementById("searchFilter").value;
  document.getElementById("searchClear").style.display = v ? "block" : "none";
}

document.getElementById("searchClear").addEventListener("click", () => {
  document.getElementById("searchFilter").value = "";
  updateSearchClear();
  applyGrouping();
});

document.getElementById("resetConfig").addEventListener("click", () => {
  try { localStorage.removeItem(CONFIG_KEY); } catch (e) { /* ignore */ }
  document.getElementById("searchFilter").value = "";
  updateSearchClear();
  document.getElementById("filterGmailSystemLabels").checked = false;
  document.getElementById("maxTreeDepth").value = "";
  document.getElementById("groupList").innerHTML = "";
  document.getElementById("jsonSelector").value = PATH_MAILS_JSON;
  currentJsonPath = PATH_MAILS_JSON;
  loadData();
});

detectServer().then(() => {
  applyConfig(loadConfig());
  loadData();
});

/* ------------------------------
   Taille human-readable
--------------------------------*/
function humanSize(n) {
  if (typeof n !== "number" || isNaN(n)) return "";
  const units = ["B", "KB", "MB", "GB", "TB", "PB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) {
    n /= 1024;
    i++;
  }
  return n.toFixed(2) + " " + units[i];
}

/* ------------------------------
   UI regroupement
--------------------------------*/
function addGroupingItem(val) {
  if (!val) return;
  const ul = document.getElementById("groupList");
  const existing = [...ul.querySelectorAll("li")].map(li => li.dataset.field);
  if (existing.includes(val)) return;

  const li = document.createElement("li");
  li.dataset.field = val;
  li.textContent = val;

  const remove = document.createElement("span");
  remove.textContent = "×";
  remove.className = "group-remove";
  remove.addEventListener("click", e => {
    e.stopPropagation();
    li.remove();
    applyGrouping();
  });

  li.appendChild(remove);
  ul.appendChild(li);
}

document.getElementById("groupAdd").addEventListener("change", e => {
  addGroupingItem(e.target.value);
  e.target.value = "";
  applyGrouping();
});

Sortable.create(document.getElementById("groupList"), {
  animation: 150,
  onEnd: () => applyGrouping()
});

document.getElementById("filterGmailSystemLabels").addEventListener("change", applyGrouping);
document.getElementById("maxTreeDepth").addEventListener("change", applyGrouping);

function getGroupingFields() {
  return [...document.querySelectorAll("#groupList li")].map(li => li.dataset.field);
}

/* ------------------------------
   Labels hiérarchiques
--------------------------------*/
function explodeLabelHierarchy(label) {
  const parts = label.split("/");
  const out = [];
  for (let i = 1; i <= parts.length; i++) {
    out.push(parts.slice(0, i).join("/"));
  }
  return out;
}

/* Plus long préfixe répertoire commun à tous les chemins (slashes normalisés) */
function commonDirPrefix(paths) {
  if (paths.length === 0) return "";
  let p = paths[0].replace(/[^/]*$/, "");
  for (const q of paths.slice(1)) {
    let i = 0;
    while (i < p.length && i < q.length && p[i] === q[i]) i++;
    p = p.slice(0, i);
    const j = p.lastIndexOf("/");
    p = j >= 0 ? p.slice(0, j + 1) : "";
  }
  return p;
}

/* Profondeur max pour les regroupements tree (vide/invalid = illimité) */
const TREE_FIELDS = new Set(["gmail_labels_tree", "source_file_tree"]);

function getMaxTreeDepth() {
  const v = parseInt(document.getElementById("maxTreeDepth").value, 10);
  return v > 0 ? v : Infinity;
}

function updateDepthVisibility() {
  const hasTree = getGroupingFields().some(f => TREE_FIELDS.has(f));
  document.getElementById("depthWrap").style.display = hasTree ? "inline-flex" : "none";
}

/* ------------------------------
   Construction de l'arbre
--------------------------------*/
function buildTree(data, groupFields) {

  const root = { id: "root", label: "root", children: [], _isLeaf: false, level: 0, expanded: true };
  const maxDepth = getMaxTreeDepth();

  const srcPrefix = groupFields.includes("source_file_tree")
    ? commonDirPrefix([...new Set(data.map(m => (m.source_file || "").replace(/\\/g, "/")).filter(Boolean))])
    : "";

  function ensureChild(node, key, labelText) {
    let child = node.children.find(c => c.id === key);
    if (!child) {
      child = {
        id: key,
        label: labelText,
        children: [],
        _isLeaf: false,
        level: node.level + 1,
        expanded: false,
        mail_count: 0,
        size: 0
      };
      node.children.push(child);
    }
    return child;
  }

  function addLeaf(node, mail, idx) {
    // Unique per record so empty message_ids don't collapse in the count Set
    const leafId = mail.message_id || ("#noid:" + idx);
    node.children.push({
      ...mail,
      id: leafId,
      _isLeaf: true,
      level: node.level + 1,
      expanded: false,
      mail_count: 1,
      size: mail.size || 0
    });
  }

  data.forEach((mail, idx) => {
    let currentNodes = [root];

    for (const field of groupFields) {

      if (field === "gmail_labels_tree") {
        const rawLabels = filterLabels(mail);
        const nextNodes = [];

        currentNodes.forEach(baseNode => {
          rawLabels.forEach(lbl => {
            const hier = explodeLabelHierarchy(lbl);
            let n = baseNode;

            hier.slice(0, maxDepth).forEach(segment => {
              const key = "gmail_labels_tree:" + segment;
              n = ensureChild(n, key, segment);
            });

            nextNodes.push(n);
          });
        });

        currentNodes = nextNodes;
        continue;
      }

      if (field === "gmail_labels") {
        const rawLabels = filterLabels(mail);
        const nextNodes = [];

        currentNodes.forEach(baseNode => {
          rawLabels.forEach(lbl => {
            const key = "gmail_labels:" + lbl;
            const n = ensureChild(baseNode, key, lbl);
            nextNodes.push(n);
          });
        });

        currentNodes = nextNodes;
        continue;
      }

      if (field === "source_file_tree") {
        const nextNodes = [];

        currentNodes.forEach(baseNode => {
          const norm = (mail.source_file || "(null)").replace(/\\/g, "/");
          const rel = norm.startsWith(srcPrefix) ? norm.slice(srcPrefix.length) : norm;
          const segments = rel.split("/").filter(Boolean);
          let n = baseNode;
          segments.slice(0, maxDepth).forEach(seg => {
            n = ensureChild(n, "source_file_tree:" + seg, seg);
          });
          nextNodes.push(n);
        });

        currentNodes = nextNodes;
        continue;
      }

      const nextNodes = [];

      currentNodes.forEach(baseNode => {
        const v = mail[field];
        const key = field + ":" + (v == null ? "(null)" : v);
        const n = ensureChild(baseNode, key, key);
        nextNodes.push(n);
      });

      currentNodes = nextNodes;
    }

    currentNodes.forEach(node => addLeaf(node, mail, idx));
  });

  /* ------------------------------
     Agrégation cumulée + tri
  --------------------------------*/
  function aggregate(node) {
    if (node._isLeaf) {
      node.mail_count = 1;
      return { count: 1, size: node.size || 0 };
    }

    let count = 0;
    let totalSize = 0;

    node.children.forEach(child => {
      const agg = aggregate(child);
      count += agg.count;
      totalSize += agg.size;
    });

    node.mail_count = count;
    node.size = totalSize;

    const isYearGroup = node.children.length > 0 &&
      node.children.every(c => !c._isLeaf && c.id.startsWith("year:"));

    if (isYearGroup) {
      node.children.sort((a, b) =>
        (parseInt(a.id.slice(5), 10) || 0) - (parseInt(b.id.slice(5), 10) || 0));
    } else {
      node.children.sort((a, b) => {
        if (!a._isLeaf && b._isLeaf) return -1;
        if (a._isLeaf && !b._isLeaf) return 1;
        return (b.size || 0) - (a.size || 0);
      });
    }

    return { count, size: totalSize };
  }

  aggregate(root);

  return root;
}

/* ------------------------------
   Flatten pour Tabulator
--------------------------------*/
function flattenTree(root) {
  const out = [];

  function rec(node) {
    out.push(node);
    if (node.expanded && node.children) {
      node.children.forEach(c => rec(c));
    }
  }

  rec(root);
  return out;
}

/* ------------------------------
   Tooltip : tous les champs d'une ligne
--------------------------------*/
function tooltipFor(row) {
  const parts = [];
  for (const [k, v] of Object.entries(row)) {
    if (k.startsWith("_") || k === "children" || k === "id") continue;
    if (v == null || v === "") continue;
    if (typeof v === "object") {
      if (Array.isArray(v) && v.length) parts.push(k + ": " + v.join(", "));
      continue;
    }
    parts.push(k + ": " + v);
  }
  return parts.join("\n");
}

/* ------------------------------
   Table Tabulator
--------------------------------*/
let table = null;

function initTable(flatData) {
  if (table) {
    const el = table.rowManager.element;
    const sp = { top: el ? el.scrollTop : 0, left: el ? el.scrollLeft : 0 };
    Promise.resolve(table.setData(flatData)).then(() => {
      const el2 = table.rowManager.element;
      if (el2) {
        el2.scrollTop = sp.top;
        el2.scrollLeft = sp.left;
      }
    });
    return;
  }

  table = new Tabulator("#treegrid", {
    data: flatData,
    layout: "fitDataFill",
    movableColumns: true,
    columns: [
      {
        title: "Name",
        field: "label",
        widthGrow: 4,
        minWidth: 220,
        formatter: cell => {
          const row = cell.getRow().getData();
          const indent = `<span class="tree-indent" style="--level:${row.level}"></span>`;
          const toggle = row._isLeaf ? "" : `<span class="tree-toggle">${row.expanded ? "▼" : "▶"}</span>`;
          const label = row._isLeaf ? (row.subject || "(no subject)") : row.label;
          const tip = tooltipFor(row).replace(/"/g, "&quot;").replace(/</g, "&lt;");
          return `<span title="${tip}">${indent}${toggle}${label}</span>`;
        },
        cellClick: (e, cell) => {
          const row = cell.getRow().getData();
          if (!row._isLeaf) {
            row.expanded = !row.expanded;
            const flat = flattenTree(treeRoot);
            table.setData(flat);
          }
        }
      },
      {
        title: "Count",
        field: "mail_count",
        width: 70,
        hozAlign: "right"
      },
      {
        title: "Size",
        field: "size",
        width: 90,
        hozAlign: "right",
        formatter: cell => humanSize(cell.getValue())
      },
      {title: "From", field: "from", widthGrow: 1, minWidth: 130},
      {title: "To", field: "to", widthGrow: 1, minWidth: 130},
      {title: "Date", field: "date", width: 160},
      {title: "Message-ID", field: "message_id", widthGrow: 1, minWidth: 140},
      {
        title: "Labels",
        field: "gmail_labels",
        widthGrow: 1,
        minWidth: 140,
        formatter: cell => Array.isArray(cell.getValue()) ? cell.getValue().join(", ") : ""
      },
      {
        title: "Source",
        field: "source_file",
        width: 170,
        formatter: cell => {
          const v = cell.getValue() || "";
          // Keep the end of the path (filename), full text on hover
          const shown = v.length > 28 ? "…" + v.slice(-27) : v;
          return `<span title="${v.replace(/"/g, "&quot;")}">${shown}</span>`;
        }
      },
    ],
  });
}

/* ------------------------------
   Spinner
--------------------------------*/
function showSpinner() {
  document.getElementById("spinner").style.display = "flex";
}
function hideSpinner() {
  document.getElementById("spinner").style.display = "none";
}

let treeRoot = null;

/* ------------------------------
   Filtrage texte (tous champs)
--------------------------------*/
function filterByText(data) {
  const q = document.getElementById("searchFilter").value.trim().toLowerCase();
  if (!q) return data;
  return data.filter(mail => JSON.stringify(mail).toLowerCase().includes(q));
}

document.getElementById("searchFilter").addEventListener("input", debounce(() => {
  updateSearchClear();
  applyGrouping();
}, 300));

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

/* ------------------------------
   Enrichissement mid_dup / mid_invalid (calculé à la demande,
   sur le JSON entier — même logique que json-mbox-enrich.py)
--------------------------------*/
function midInvalid(raw) {
  if (typeof raw !== "string" || !raw.trim()) return "";
  const s = raw.trim();
  if (!(s.startsWith("<") && s.endsWith(">"))) return "missing_angles";
  const inner = s.slice(1, -1);
  if (!inner.includes("@")) return "no_at_sign";
  if (!/^[^<>\s@]+@[^<>\s@]+$/.test(inner)) return "bad_chars";
  return "";
}

let fieldsEnriched = false;

function enrichFields(data) {
  if (fieldsEnriched) return;
  const counts = new Map();
  const sources = new Map();
  data.forEach(m => {
    const mid = m.message_id;
    if (mid) {
      counts.set(mid, (counts.get(mid) || 0) + 1);
      if (!sources.has(mid)) sources.set(mid, new Set());
      if (m.source_file) sources.get(mid).add(m.source_file);
    }
  });
  data.forEach(m => {
    const mid = m.message_id;
    m.mid_dup = (mid && counts.get(mid) > 1) ? mid : "";
    m.mid_invalid = midInvalid(mid);
    m.dup_status = m.mid_dup ? "yes" : "no";
    m.dup_sources = m.mid_dup ? [...(sources.get(mid) || [])].join(", ") : "";
  });
  fieldsEnriched = true;
}

/* ------------------------------
   Application du regroupement
--------------------------------*/
const COMPUTE_FIELDS = new Set(["mid_dup", "mid_invalid", "dup_status"]);

async function applyGrouping() {
  updateDepthVisibility();
  saveConfig();
  showSpinner();
  await new Promise(r => setTimeout(r, 0));

  const fields = getGroupingFields();
  if (fields.some(f => COMPUTE_FIELDS.has(f))) {
    enrichFields(RAW_DATA);
  }
  const filtered = filterByText(RAW_DATA);
  treeRoot = buildTree(filtered, fields);
  const flat = flattenTree(treeRoot);

  initTable(flat);

  hideSpinner();
}

document.getElementById("applyGrouping").addEventListener("click", applyGrouping);
</script>
