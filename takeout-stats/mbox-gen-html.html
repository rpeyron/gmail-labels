<!DOCTYPE html>
<!-- 
This file is the HTML viewer for json data analysed from Gmail Takeout mbox files. It is generated by the script mbox-gen-html.js.

1. Run the script to generate the JSON data:   python mbox-gen-html.py <mbox|maildir>...
2. Serve the files with a local HTTP server:   python -m http.server 9000
3. Open the HTML viewer in a browser:         http://localhost:9000/mbox-gen-html.html

-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Explorateur mails</title>

<!-- Tabulator 6.5.0 -->
<link href="https://unpkg.com/tabulator-tables@6.5.0/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@6.5.0/dist/js/tabulator.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  padding: 0;
  background: #f5f5f5;
}

#controls {
  padding: 12px 16px;
  background: #f0f0f0;
  border-bottom: 2px solid #ddd;
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#controls-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

#groupList {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

#groupList li {
  padding: 4px 10px;
  border: 1px solid #ccc;
  border-radius: 16px;
  background: #fafafa;
  cursor: grab;
  font-size: 0.9em;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.group-remove {
  cursor: pointer;
  font-size: 0.9em;
  color: #888;
}

.group-remove:hover {
  color: #c00;
}

#treegrid {
  height: calc(100vh - 60px);
  background: #fff;
}

/* spinner */
#spinner {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: #333;
  z-index: 9999;
}

.tree-toggle {
  cursor: pointer;
  font-size: 14px;
  margin-right: 6px;
  user-select: none;
}

.tree-indent {
  display: inline-block;
  width: calc(var(--level) * 18px);
}
</style>
</head>
<body>

<div id="controls">
  <div id="controls-top">
    <span>Regroupement :</span>

    <ul id="groupList"></ul>

    <select id="groupAdd">
      <option value="">Ajouter un critère…</option>
      <option value="year">Année</option>
      <option value="gmail_labels">Labels Gmail (plats)</option>
      <option value="gmail_labels_tree">Labels Gmail (arbre)</option>
      <option value="from">Expéditeur</option>
      <option value="to">Destinataire</option>
      <option value="source_file">Fichier source</option>
    </select>

    <button id="applyGrouping">Appliquer</button>

    <label style="margin-left:20px;">
      <input type="checkbox" id="filterGmailSystemLabels">
      Masquer labels Gmail automatiques
    </label>
  </div>
</div>

<div id="treegrid"></div>

<div id="spinner">Calcul en cours…</div>

<script>

const PATH_MAILS_JSON = "data/mails.json";

let RAW_DATA = [];

/* ------------------------------
   Labels Gmail automatiques
--------------------------------*/
const GMAIL_SYSTEM_LABELS = new Set([
  "IMPORTANT", "Important",
  "Ouvert",
  "Messages archivés",
  "INBOX", "Boîte de réception",
  "STARRED", "Favoris",
  // "SENT", "Messages envoyés",
  "DRAFT", "Brouillons",
  "SPAM",
  "TRASH",
  "UNREAD", "Non lus",
  "CATEGORY_PERSONAL", "Catégorie : E-mails personnels",
  "CATEGORY_SOCIAL", "Catégorie : Réseaux sociaux",
  "CATEGORY_UPDATES", "Catégorie : Mises à jour",
  "CATEGORY_PROMOTIONS", "Catégorie : Promotions",
  "CATEGORY_FORUMS", "Catégorie : Forums",
  "IMAP_NonJunk",
  "IMAP_Junk",
  "Forward to 0660314776@imode.fr",
  "Forward to remi.peyronnet@free.fr",
  "Ignoré",
  "Messagerie instantanée",
  "En attente"
]);

/* ------------------------------
   Filtrage des labels Gmail
--------------------------------*/
function filterLabels(mail) {
  const hideSystem = document.getElementById("filterGmailSystemLabels").checked;

  let labels = Array.isArray(mail.gmail_labels) ? mail.gmail_labels.slice() : [];

  if (hideSystem) {
    labels = labels.filter(lbl => !GMAIL_SYSTEM_LABELS.has(lbl));
  }

  if (labels.length === 0) {
    labels = ["(sans label filtré)"];
  }

  return labels;
}

/* ------------------------------
   Chargement du JSON
--------------------------------*/
fetch(PATH_MAILS_JSON)
  .then(r => r.json())
  .then(data => {
    RAW_DATA = data;
    addGroupingItem("year");
    addGroupingItem("gmail_labels_tree");
    applyGrouping();
  });

/* ------------------------------
   Taille human-readable
--------------------------------*/
function humanSize(n) {
  if (typeof n !== "number" || isNaN(n)) return "";
  const units = ["octets", "Ko", "Mo", "Go", "To", "Po"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) {
    n /= 1024;
    i++;
  }
  return n.toFixed(2) + " " + units[i];
}

/* ------------------------------
   UI regroupement
--------------------------------*/
function addGroupingItem(val) {
  if (!val) return;
  const ul = document.getElementById("groupList");
  const existing = [...ul.querySelectorAll("li")].map(li => li.dataset.field);
  if (existing.includes(val)) return;

  const li = document.createElement("li");
  li.dataset.field = val;
  li.textContent = val;

  const remove = document.createElement("span");
  remove.textContent = "×";
  remove.className = "group-remove";
  remove.addEventListener("click", e => {
    e.stopPropagation();
    li.remove();
  });

  li.appendChild(remove);
  ul.appendChild(li);
}

document.getElementById("groupAdd").addEventListener("change", e => {
  addGroupingItem(e.target.value);
  e.target.value = "";
});

Sortable.create(document.getElementById("groupList"), { animation: 150 });

function getGroupingFields() {
  return [...document.querySelectorAll("#groupList li")].map(li => li.dataset.field);
}

/* ------------------------------
   Labels hiérarchiques
--------------------------------*/
function explodeLabelHierarchy(label) {
  const parts = label.split("/");
  const out = [];
  for (let i = 1; i <= parts.length; i++) {
    out.push(parts.slice(0, i).join("/"));
  }
  return out;
}

/* ------------------------------
   Construction de l'arbre
--------------------------------*/
function buildTree(data, groupFields) {

  const root = { id: "root", label: "root", children: [], _isLeaf: false, level: 0, expanded: true };

  function ensureChild(node, key, labelText) {
    let child = node.children.find(c => c.id === key);
    if (!child) {
      child = {
        id: key,
        label: labelText,
        children: [],
        _isLeaf: false,
        level: node.level + 1,
        expanded: false,
        mail_count: 0,
        size: 0,
        _unique: new Set()
      };
      node.children.push(child);
    }
    return child;
  }

  function addLeaf(node, mail) {
    node.children.push({
      id: mail.message_id,
      _isLeaf: true,
      level: node.level + 1,
      expanded: false,
      mail_count: 1,
      size: mail.size || 0,
      _unique: new Set([mail.message_id]),
      ...mail
    });
  }

  data.forEach(mail => {
    let currentNodes = [root];

    for (const field of groupFields) {

      if (field === "gmail_labels_tree") {
        const rawLabels = filterLabels(mail);
        const nextNodes = [];

        currentNodes.forEach(baseNode => {
          rawLabels.forEach(lbl => {
            const hier = explodeLabelHierarchy(lbl);
            let n = baseNode;

            hier.forEach(segment => {
              const key = "gmail_labels_tree:" + segment;
              n = ensureChild(n, key, segment);
            });

            nextNodes.push(n);
          });
        });

        currentNodes = nextNodes;
        continue;
      }

      if (field === "gmail_labels") {
        const rawLabels = filterLabels(mail);
        const nextNodes = [];

        currentNodes.forEach(baseNode => {
          rawLabels.forEach(lbl => {
            const key = "gmail_labels:" + lbl;
            const n = ensureChild(baseNode, key, lbl);
            nextNodes.push(n);
          });
        });

        currentNodes = nextNodes;
        continue;
      }

      const nextNodes = [];

      currentNodes.forEach(baseNode => {
        const v = mail[field];
        const key = field + ":" + (v == null ? "(null)" : v);
        const n = ensureChild(baseNode, key, key);
        nextNodes.push(n);
      });

      currentNodes = nextNodes;
    }

    currentNodes.forEach(node => addLeaf(node, mail));
  });

  /* ------------------------------
     Agrégation cumulée + tri
  --------------------------------*/
  function aggregate(node) {
    if (node._isLeaf) {
      const ids = new Set([node.id]);
      const size = node.size || 0;
      node._unique = ids;
      node.mail_count = ids.size;
      node.size = size;
      return { ids, size };
    }

    let ids = new Set();

    node.children.forEach(child => {
      const agg = aggregate(child);
      agg.ids.forEach(id => ids.add(id));
    });

    const sizeById = new Map();

    function collectSizes(n) {
      if (n._isLeaf) {
        const id = n.id;
        const s = n.size || 0;
        if (!sizeById.has(id)) sizeById.set(id, s);
      } else if (n.children) {
        n.children.forEach(c => collectSizes(c));
      }
    }

    collectSizes(node);

    let totalSize = 0;
    ids.forEach(id => {
      totalSize += sizeById.get(id) || 0;
    });

    node._unique = ids;
    node.mail_count = ids.size;
    node.size = totalSize;

    node.children.sort((a, b) => {
      if (!a._isLeaf && b._isLeaf) return -1;
      if (a._isLeaf && !b._isLeaf) return 1;
      return (b.size || 0) - (a.size || 0);
    });

    return { ids, size: totalSize };
  }

  aggregate(root);

  console.log("ARBRE COMPLET :", JSON.parse(JSON.stringify(root)));

  return root;
}

/* ------------------------------
   Flatten pour Tabulator
--------------------------------*/
function flattenTree(root) {
  const out = [];

  function rec(node) {
    out.push(node);
    if (node.expanded && node.children) {
      node.children.forEach(c => rec(c));
    }
  }

  rec(root);
  return out;
}

/* ------------------------------
   Table Tabulator
--------------------------------*/
let table = null;

function initTable(flatData) {
  if (table) {
    table.setData(flatData);
    return;
  }

  table = new Tabulator("#treegrid", {
    data: flatData,
    // height: "100%",
    layout: "fitDataStretch",
    movableColumns: true,
    columns: [
      {
        title: "Nom",
        field: "label",
        widthGrow: 3,
        formatter: cell => {
          const row = cell.getRow().getData();
          const indent = `<span class="tree-indent" style="--level:${row.level}"></span>`;
          const toggle = row._isLeaf ? "" : `<span class="tree-toggle">${row.expanded ? "▼" : "▶"}</span>`;
          const label = row._isLeaf ? (row.subject || "(sans sujet)") : row.label;
          return indent + toggle + label;
        },
        cellClick: (e, cell) => {
          const row = cell.getRow().getData();
          if (!row._isLeaf) {
            row.expanded = !row.expanded;
            const flat = flattenTree(treeRoot);
            table.setData(flat);
          }
        }
      },
      {
        title: "Mails",
        field: "mail_count",
        width: 80
      },
      {
        title: "Taille",
        field: "size",
        width: 120,
        formatter: cell => humanSize(cell.getValue())
      },
      {title: "From", field: "from", widthGrow: 2},
      {title: "To", field: "to", widthGrow: 2},
      {title: "Date", field: "date", widthGrow: 2},
      {title: "Message-ID", field: "message_id", widthGrow: 2},
      {
        title: "Labels",
        field: "gmail_labels",
        widthGrow: 2,
        formatter: cell => Array.isArray(cell.getValue()) ? cell.getValue().join(", ") : ""
      },
      {title: "Source", field: "source_file", widthGrow: 2},
    ],
  });
}

/* ------------------------------
   Spinner
--------------------------------*/
function showSpinner() {
  document.getElementById("spinner").style.display = "flex";
}
function hideSpinner() {
  document.getElementById("spinner").style.display = "none";
}

let treeRoot = null;

/* ------------------------------
   Application du regroupement
--------------------------------*/
async function applyGrouping() {
  showSpinner();
  await new Promise(r => setTimeout(r, 0));

  const fields = getGroupingFields();
  treeRoot = buildTree(RAW_DATA, fields);
  const flat = flattenTree(treeRoot);

  initTable(flat);

  hideSpinner();
}

document.getElementById("applyGrouping").addEventListener("click", applyGrouping);
</script>

</body>
</html>
